  flumepod:
    path: ../
  mockito: ^5.4.5
  riverpod_annotation: ^4.0.0
  test: ^1.25.9


dev_dependencies:
  flutter_lints: ^6.0.0
  riverpod_lint: ^3.1.3
  riverpod_generator: ^4.0.0+1
  build_runner: ^2.4.13
